name = "gasti-wallet"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/webhook/*"]

[[d1_databases]]
binding = "DB"
database_name = "wallet-db"
database_id = "1a95d0d7-cbae-4543-ab35-706ac0967915"
migrations_dir = "migrations"

[vars]
APP_ENV = "production"
DEFAULT_CURRENCY = "ARS"
TIMEZONE = "America/Argentina/Buenos_Aires"
DASHBOARD_URL = "https://gasti-wallet.lisandro-dev.workers.dev"

name = "gasti-wallet"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/webhook/*"]

[[d1_databases]]
binding = "DB"
database_name = "wallet-db"
database_id = "<REEMPLAZAR_CON_TU_DATABASE_ID>"
migrations_dir = "migrations"

# Secretos OBLIGATORIOS en v3.1 (cargar con `npx wrangler secret put <NOMBRE>`):
# GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
# ALLOWED_TELEGRAM_USER_ID y DASHBOARD_TOKEN (autenticación fail-closed).
[vars]
APP_ENV = "production"
DEFAULT_CURRENCY = "ARS" # Monedas soportadas: ARS, USD o BRL
TIMEZONE = "America/Argentina/Buenos_Aires"
DASHBOARD_URL = "https://<tu-worker>.workers.dev"
